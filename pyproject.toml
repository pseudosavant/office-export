[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "office-export"
version = "0.2.0"
description = "Export Microsoft Office documents to PDF and images through desktop Office"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "John Paul Ellis" }]
keywords = ["office", "word", "excel", "powerpoint", "pdf", "png", "jpeg", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "packaging>=24.2",
  "PyYAML>=6.0.2,<7",
  "pypdfium2>=5.13,<6",
  "Pillow>=11,<13",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/pseudosavant/office-export"
Repository = "https://github.com/pseudosavant/office-export"
Issues = "https://github.com/pseudosavant/office-export/issues"
Releases = "https://github.com/pseudosavant/office-export/releases"

[project.scripts]
office-export = "office_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/office_export"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/PLAN.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -m 'not office'"
markers = [
  "office: requires an interactive Windows session with licensed desktop Microsoft Office",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff==0.16.1",
  "twine>=6.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
